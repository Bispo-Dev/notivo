<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff"><title>Notivo — Suas partituras, sempre à mão.</title>
<link rel="manifest" href="notivo.webmanifest"><link rel="icon" href="notivo-icon.svg" type="image/svg+xml"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Notivo">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap');
:root{--bg:#fff;--card:#fff;--soft:#f4effc;--ink:#1f1340;--tx:#2e1a6b;--tx2:#5b4d85;--ln:#e6ddf7;--ln2:#efe9fa;--ln3:#d9ccf5;--acc:#6d3bd2;--act:#ede5fb;--shadow:0 8px 30px #2e1a6b12}
[data-theme=dark]{--bg:#14102a;--card:#1b1636;--soft:#1f1940;--ink:#f1ebff;--tx:#f1ebff;--tx2:#b3a6d9;--ln:#2e2552;--ln2:#241d45;--ln3:#3f3470;--acc:#b79cf0;--act:#2e2552;--shadow:0 8px 30px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px Poppins,system-ui,sans-serif;transition:background .2s}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8a5ce8;outline-offset:2px}.app{max-width:1100px;margin:auto;padding:30px 36px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;align-items:center;color:var(--tx);font-weight:500;font-size:30px;letter-spacing:-1px}.brand svg{width:30px;height:32px;color:var(--acc);margin-right:2px}.tag{font-size:12px;color:var(--tx2);margin-top:3px}.actions{display:flex;gap:10px}.btn,.iconbtn{border:1px solid var(--ln3);background:var(--card);border-radius:12px;min-height:44px;padding:9px 15px;color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:#6d3bd2;color:white;border-color:#6d3bd2}.iconbtn{width:44px;padding:0}.btn:hover,.iconbtn:hover{background:var(--soft)}.btn.primary:hover{background:#5b2dbb}.head{display:flex;align-items:end;justify-content:space-between;margin:20px 0}.head h1{font-size:25px;font-weight:500;color:var(--tx);margin:0}.muted{color:var(--tx2);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:16px}.collection{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px;display:flex;gap:15px;align-items:center;cursor:pointer;min-height:104px}.collection:hover{border-color:var(--acc);box-shadow:var(--shadow)}.badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:white;flex:none}.collection h2{font-size:16px;font-weight:500;color:var(--tx);margin:0 0 3px}.row{display:flex;gap:12px;align-items:center}.search{width:min(380px,100%);height:46px;border:1px solid var(--ln);border-radius:13px;background:var(--soft);padding:0 14px}.list{border-top:1px solid var(--ln)}.song{display:grid;grid-template-columns:34px 1fr 44px;align-items:center;gap:10px;padding:13px 3px;border-bottom:1px solid var(--ln2);min-height:68px}.song.selected{background:var(--soft)}.songmain{cursor:pointer;min-width:0}.songname{color:var(--tx);font-size:14px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.songcollections{font-size:11px;color:var(--tx2);margin-top:3px}.hint{font-size:12px;color:var(--tx2);margin:12px 0}.selectionbar,.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:4;box-shadow:var(--shadow);border:1px solid var(--ln);background:var(--card);border-radius:18px;display:flex;gap:8px;align-items:center;padding:9px}.selectionbar{background:#2e1a6b;color:white;border:0}.selectionbar .btn{min-height:40px}.reader{position:fixed;inset:0;background:#e8e3ee;z-index:5;display:flex;flex-direction:column}.reader.dark{background:#e8e3ee}.tabs{height:54px;background:var(--bg);display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--ln);flex:none}.tab{display:flex;align-items:center;gap:5px;padding:0 12px;height:42px;border:0;background:transparent;color:var(--tx2);border-bottom:2px solid transparent;max-width:220px}.tab.active{color:var(--tx);border-bottom-color:var(--acc)}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab button{border:0;background:none;color:inherit;padding:4px}.spacer{flex:1}.pdfstage{position:relative;flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px}.page{position:relative;width:min(760px,100%);min-height:900px;background:white;box-shadow:0 2px 15px #0002;overflow:hidden}.pdfembed{position:absolute;inset:0;width:100%;height:100%;border:0}.score{padding:70px 54px;color:#211839;font:18px 'Source Serif 4',Georgia,serif}.score h2{text-align:center;font-weight:600;font-size:25px}.score .composer{text-align:center;font-size:14px;margin-bottom:44px}.staff{height:115px;margin:25px 0 10px;background:repeating-linear-gradient(to bottom,transparent 0 19px,#252033 20px,#252033 21px,transparent 22px 24px)}.staff:after{content:'𝄞  ♩   ♪   ♫      ♬  ♩     ♪';display:block;padding:7px 24px;font-size:25px;letter-spacing:10px}.ann{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.toolbar{bottom:25px}.tool.active{background:var(--act);border-color:var(--acc)}.palette{display:flex;gap:8px}.swatch{width:24px;height:24px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px var(--ln3);padding:0}.focused-tab{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:7;border:0;border-radius:0 0 14px 14px;background:var(--card);color:var(--tx);padding:5px 22px;box-shadow:var(--shadow);min-height:32px}.empty{padding:30px;text-align:center;color:var(--tx2);border:1px dashed var(--ln3);border-radius:16px}.modalback{position:fixed;inset:0;background:#160d2f66;display:grid;place-items:center;z-index:10;padding:20px}.modal{background:var(--bg);border-radius:20px;padding:24px;width:min(440px,100%);box-shadow:var(--shadow)}.modal h2{margin:0 0 20px;color:var(--tx);font-weight:500}.modal label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 6px}.modal input,.modal select{width:100%;height:44px;border:1px solid var(--ln3);background:var(--card);border-radius:10px;padding:0 12px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.colorrow{display:flex;gap:10px}.colorpick{width:34px;height:34px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px var(--ln3)}[hidden]{display:none!important}
@media(max-width:640px){.app{padding:20px 16px 50px}.grid{grid-template-columns:1fr}.top{margin-bottom:22px}.tag{display:none}.head{align-items:center;gap:12px}.head h1{font-size:21px}.search{max-width:100%}.toolbar{max-width:calc(100vw - 18px);gap:3px;padding:6px;bottom:12px}.toolbar .iconbtn{width:40px;min-height:40px}.palette{gap:5px}.swatch{width:20px;height:20px}.page{min-height:1050px}.score{padding:55px 25px}.tabs{padding:0 4px}.tab{padding:0 6px;max-width:150px}.selectionbar{width:calc(100vw - 24px);justify-content:center}.selectionbar .btn{padding:7px 9px}}
</style>
</head>
<body><div id="app" class="app"></div><div id="overlay"></div>
<svg width="0" height="0" style="position:absolute"><symbol id="logoN" viewBox="-5.34 0 71.34 67.23"><path d="M10 46.4v10a9 9 0 0 1-9 11 9 9 0 0 1-6-14L18 18q2-2 4 0l28 29q2 3-1 5a12 12 0 0 0-5 9q0 8 9 8t12-9V4a4 4 0 1 0-8 0v34q0 4-4 2L17 2q-7-6-7 3z" fill="currentColor"/></symbol></svg>
<script>
const KEY='notivo-prototipo-v1', colors=['#000000','#E53935','#FACC15','#22A559','#6D3BD2'];
const icon=(name)=>({home:'⌂',plus:'+',search:'⌕',edit:'✎',close:'×',pen:'✎',highlight:'▰',erase:'⌫',undo:'↶',download:'↓',up:'⌃',check:'✓',book:'♫'}[name]||'•');
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{theme:'light',collections:[{id:'orq',name:'Orquestra',color:'#6D3BD2',icon:'♫'},{id:'banda',name:'Banda',color:'#E53935',icon:'♬'},{id:'igreja',name:'Igreja',color:'#22A559',icon:'⌂'},{id:'estudos',name:'Estudos',color:'#FACC15',icon:'♫'}],songs:[{id:'demo1',name:'Concerto em Ré menor',collections:['orq'],demo:true},{id:'demo2',name:'Ave Maria',collections:['igreja'],demo:true},{id:'demo3',name:'Suíte nº 1',collections:['orq','estudos'],demo:true},{id:'demo4',name:'Marcha Triunfal',collections:['banda'],demo:true}],view:'home',collection:null,search:'',selected:[],tabs:[],active:null,focused:false,hideTabs:false,hideTools:false,tool:'pen',color:'#000000',strokes:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state)), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.documentElement.dataset.theme=state.theme;const root=document.querySelector('#app');if(state.view==='reader'){document.querySelector('[data-reader]')?.remove();root.innerHTML='';renderReader();return}document.querySelector('[data-reader]')?.remove();document.querySelector('#overlay').innerHTML='';root.innerHTML=`<header class="top"><div><div class="brand" aria-label="Notivo"><svg><use href="#logoN"/></svg>otivo</div><div class="tag">Suas partituras, sempre à mão.</div></div><div class="actions"><button class="iconbtn" aria-label="Alternar tema" title="Alternar tema" onclick="toggleTheme()">${state.theme==='light'?'☾':'☀'}</button></div></header>${state.view==='home'?home():list()}`}
function home(){return `<div class="head"><div><h1>Sua biblioteca</h1><div class="muted">Escolha uma coleção para começar</div></div><button class="btn" onclick="editCollection()">${icon('plus')} Nova coleção</button></div><div class="grid">${state.collections.map(c=>`<article class="collection" onclick="openCollection('${c.id}')"><div class="badge" style="background:${esc(c.color)}">${esc(c.icon)}</div><div style="flex:1"><h2>${esc(c.name)}</h2><div class="muted">${state.songs.filter(s=>s.collections.includes(c.id)).length} partituras</div></div><button class="iconbtn" aria-label="Editar ${esc(c.name)}" onclick="event.stopPropagation();editCollection('${c.id}')">${icon('edit')}</button></article>`).join('')}</div><p class="hint">Seus dados deste protótipo ficam neste navegador.</p>`}
function list(){const c=state.collections.find(x=>x.id===state.collection), songs=state.songs.filter(s=>(!c||s.collections.includes(c.id))&&s.name.toLowerCase().includes(state.search.toLowerCase()));return `<div class="head"><div><button class="btn" onclick="state.view='home';state.selected=[];render()">${icon('home')} Biblioteca</button><h1 style="margin-top:10px">${esc(c?.name||'Todas as partituras')} <span class="muted">${songs.length}</span></h1></div><div class="row"><input class="search" placeholder="Buscar partitura" aria-label="Buscar partitura" value="${esc(state.search)}" oninput="state.search=this.value;const p=this.selectionStart;render();const n=document.querySelector('.search');n.focus();n.setSelectionRange(p,p)"><button class="btn primary" onclick="document.querySelector('#files').click()">${icon('plus')} Importar PDFs</button><input id="files" type="file" accept="application/pdf,.pdf" multiple hidden onchange="importFiles(this.files)"></div></div><p class="hint">Segure uma partitura para selecionar, mesmo de coleções diferentes. Toque no lápis para renomear.</p><div class="list">${songs.map(s=>`<article class="song ${state.selected.includes(s.id)?'selected':''}" oncontextmenu="event.preventDefault();toggleSelect('${s.id}')" ontouchstart="holdStart('${s.id}')" ontouchend="holdEnd()"><button class="iconbtn" aria-label="${state.selected.includes(s.id)?'Desselecionar':'Selecionar'} ${esc(s.name)}" onclick="toggleSelect('${s.id}')">${state.selected.includes(s.id)?icon('check'):'○'}</button><div class="songmain" onclick="${state.selected.length?`toggleSelect('${s.id}')`:`openSong('${s.id}')`}"><div class="songname">${esc(s.name)}</div><div class="songcollections">${s.collections.map(id=>state.collections.find(x=>x.id===id)?.name).filter(Boolean).map(esc).join(' · ')||'Sem coleção'}</div></div><button class="iconbtn" aria-label="Renomear ${esc(s.name)}" onclick="renameSong('${s.id}')">${icon('edit')}</button></article>`).join('')||'<div class="empty">Nenhuma partitura encontrada.<br>Importe arquivos PDF para começar.</div>'}</div>${state.selected.length?`<div class="selectionbar"><strong>${state.selected.length} selecionada${state.selected.length>1?'s':''}</strong><button class="btn" onclick="state.selected=[];render()">Limpar</button><button class="btn primary" onclick="openSelected()">Abrir em abas</button></div>`:''}`}
function holdStart(id){window.holdTimer=setTimeout(()=>toggleSelect(id),550)}function holdEnd(){clearTimeout(window.holdTimer)}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';save();render()}function openCollection(id){state.collection=id;state.search='';state.view='list';state.selected=[];render()}
function editCollection(id){const c=state.collections.find(x=>x.id===id)||{name:'',color:'#6D3BD2',icon:'♫'};modal(`<h2>${id?'Editar':'Nova'} coleção</h2><label>Nome</label><input id="cname" maxlength="40" value="${esc(c.name)}" placeholder="Ex.: Quarteto"><label>Ícone</label><select id="cicon"><option>♫</option><option>♬</option><option>⌂</option><option>♩</option><option>♪</option></select><label>Cor</label><div class="colorrow">${['#6D3BD2','#E53935','#22A559','#FACC15','#2E1A6B'].map(x=>`<button class="colorpick" style="background:${x}" onclick="document.querySelector('#ccolor').value='${x}'" aria-label="Cor ${x}"></button>`).join('')}<input id="ccolor" type="color" value="${c.color}" style="width:44px;padding:4px"></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCollection('${id||''}')">Concluir</button></div>`);document.querySelector('#cicon').value=c.icon}
function saveCollection(id){const name=document.querySelector('#cname').value.trim();if(!name){document.querySelector('#cname').focus();return}if(id)Object.assign(state.collections.find(c=>c.id===id),{name,color:document.querySelector('#ccolor').value,icon:document.querySelector('#cicon').value});else state.collections.push({id:crypto.randomUUID(),name,color:document.querySelector('#ccolor').value,icon:document.querySelector('#cicon').value});closeModal();save();render()}
function modal(html){document.querySelector('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal">${html}</section></div>`}function closeModal(){document.querySelector('#overlay').innerHTML=''}
function renameSong(id){const s=state.songs.find(x=>x.id===id);modal(`<h2>Renomear partitura</h2><label>Nome no Notivo</label><input id="newname" maxlength="120" value="${esc(s.name)}"><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="const v=document.querySelector('#newname').value.trim();if(v){state.songs.find(x=>x.id==='${id}').name=v;save();closeModal();render()}">Concluir</button></div>`)}
function importFiles(files){for(const f of files){if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))continue;const s={id:crypto.randomUUID(),name:f.name.replace(/\.pdf$/i,''),collections:state.collection?[state.collection]:[],file:null};const r=new FileReader();r.onload=()=>{s.file=r.result;state.songs.push(s);save();render()};r.readAsDataURL(f)} }
function openSong(id){state.tabs=state.tabs.includes(id)?state.tabs:[...state.tabs,id];state.active=id;state.view='reader';state.focused=false;save();render()}
function openSelected(){const ids=[...state.selected];state.tabs=[...new Set([...state.tabs,...ids])];state.active=ids.at(-1);state.selected=[];state.view='reader';state.focused=false;save();render()}
function renderReader(){const s=state.songs.find(x=>x.id===state.active)||state.songs[0];if(!s){state.view='home';render();return}const bar=document.createElement('section');bar.className='reader';bar.innerHTML=`${state.focused?`<button class="focused-tab" onclick="state.focused=false;state.hideTabs=false;state.hideTools=false;render()" aria-label="Reabrir abas e ferramentas">⌄</button>`:''}${!state.focused&&!state.hideTabs?`<nav class="tabs"><button class="iconbtn" aria-label="Biblioteca" onclick="state.view='list';state.collection=null;render()">${icon('home')}</button>${state.tabs.map(id=>{const t=state.songs.find(x=>x.id===id);return t?`<div class="tab ${id===state.active?'active':''}"><span onclick="state.active='${id}';render()">${esc(t.name)}</span><button aria-label="Fechar aba" onclick="closeTab('${id}')">×</button></div>`:''}).join('')}<button class="iconbtn" aria-label="Adicionar partitura" onclick="addTabPicker()">+</button><div class="spacer"></div><button class="iconbtn" aria-label="Recolher abas" onclick="state.hideTabs=true;render()">⌃</button></nav>`:''}${!state.focused&&state.hideTabs?`<button class="focused-tab" style="top:0" aria-label="Mostrar abas" onclick="state.hideTabs=false;render()">⌄</button>`:''}<div class="pdfstage"><div class="page" id="page">${s.file?`<iframe class="pdfembed" src="${s.file}#toolbar=0&navpanes=0" title="${esc(s.name)}"></iframe>`:`<div class="score"><h2>${esc(s.name)}</h2><div class="composer">Partitura de demonstração · Andante</div>${[1,2,3,4,5,6].map(()=>'<div class="staff"></div>').join('')}<p style="text-align:center;color:#817996;margin-top:48px">Importe um PDF para visualizar seu documento</p></div>`}<canvas class="ann" id="ann" aria-label="Camada de anotações"></canvas></div></div>${!state.focused&&!state.hideTools?`<div class="toolbar">${[['pen','Caneta'],['highlight','Grifador'],['erase','Borracha']].map(([k,n])=>`<button class="iconbtn tool ${state.tool===k?'active':''}" aria-label="${n}" title="${n}" onclick="state.tool='${k}';render()">${icon(k)}</button>`).join('')}<span class="palette">${colors.map(c=>`<button class="swatch" style="background:${c};outline:${state.color===c?'2px solid var(--acc)':''}" aria-label="Cor ${c}" onclick="state.color='${c}';save();render()"></button>`).join('')}<input type="color" aria-label="Escolher cor" value="${state.color}" onchange="state.color=this.value;save();render()" style="width:30px;height:30px;border:0;padding:0;background:none"></span><button class="iconbtn" aria-label="Desfazer" title="Desfazer" onclick="undo()">${icon('undo')}</button><button class="iconbtn" aria-label="Exportar PDF" title="Exportar PDF" onclick="exportPdf()">${icon('download')}</button><button class="iconbtn" aria-label="Recolher ferramentas" onclick="state.hideTools=true;render()">⌄</button></div>`:''}${!state.focused&&state.hideTools?`<button class="focused-tab" style="top:auto;bottom:0;left:50%;border-radius:14px 14px 0 0" aria-label="Mostrar ferramentas" onclick="state.hideTools=false;render()">⌃</button>`:''}`;document.querySelector('#overlay').innerHTML='';document.body.append(bar);bar.dataset.reader='';setupCanvas(s.id)}
function closeTab(id){state.tabs=state.tabs.filter(x=>x!==id);if(state.active===id)state.active=state.tabs.at(-1);if(!state.tabs.length){state.view='list'}save();render()}
function addTabPicker(){const options=state.songs.map(x=>`<button class="songmain" style="padding:10px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left" onclick="openSong('${x.id}')">${esc(x.name)}</button>`).join('');modal(`<h2>Adicionar partitura</h2><div style="max-height:50vh;overflow:auto">${options||'Nenhuma partitura importada.'}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Fechar</button></div>`)}
function strokesFor(id){return state.strokes[id]||[]}
function setupCanvas(id){const cv=document.querySelector('#ann'),p=document.querySelector('#page'),dpr=devicePixelRatio||1;cv.width=p.clientWidth*dpr;cv.height=p.clientHeight*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);function paint(){ctx.clearRect(0,0,p.clientWidth,p.clientHeight);for(const a of strokesFor(id)){ctx.globalAlpha=a.tool==='highlight'?.32:1;ctx.strokeStyle=a.color;ctx.lineWidth=a.tool==='highlight'?18:3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();a.points.forEach((pt,i)=>i?ctx.lineTo(pt.x*p.clientWidth,pt.y*p.clientHeight):ctx.moveTo(pt.x*p.clientWidth,pt.y*p.clientHeight));ctx.stroke()}ctx.globalAlpha=1}paint();let active=null;const point=e=>({x:e.offsetX/cv.clientWidth,y:e.offsetY/cv.clientHeight});cv.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;cv.setPointerCapture(e.pointerId);if(state.tool==='erase'){let all=strokesFor(id);const pt=point(e),before=all.length;state.strokes[id]=all.filter(a=>!a.points.some(q=>Math.hypot((q.x-pt.x)*cv.clientWidth,(q.y-pt.y)*cv.clientHeight)<20));if(before!==state.strokes[id].length){localStorage.setItem('notivo-undo',JSON.stringify({id,all}));save();paint()}return}active={tool:state.tool,color:state.color,points:[point(e)]}};cv.onpointermove=e=>{if(!active)return;active.points.push(point(e));state.strokes[id]=[...strokesFor(id).filter(a=>a!==active),active];paint()};cv.onpointerup=()=>{if(!active)return;active=null;save();paint()};cv.onpointercancel=cv.onpointerup}
function undo(){const key='notivo-undo',old=JSON.parse(localStorage.getItem(key)||'null');if(old&&old.id===state.active){state.strokes[old.id]=old.all;localStorage.removeItem(key)}else state.strokes[state.active]=strokesFor(state.active).slice(0,-1);save();render()}
function exportPdf(){alert('A exportação de PDF anotado requer a biblioteca de PDF do aplicativo final. Neste protótipo, use a impressão do navegador para salvar uma cópia visual da página.');window.print()}
render();
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./notivo-sw.js');
</script></body></html>
